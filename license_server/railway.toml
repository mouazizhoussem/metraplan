# railway.toml — Configuration pour Railway.app
# Docs : https://docs.railway.app/reference/config-as-code
#
# Railway utilise le système de fichiers persistant → SQLite fonctionne parfaitement.
# Aucune base de données externe n'est nécessaire (sauf si vous voulez PostgreSQL).
#
# Pour déployer :
#   1. railway login
#   2. cd license_server && railway init
#   3. railway up

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
